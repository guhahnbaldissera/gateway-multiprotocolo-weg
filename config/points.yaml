# ============================================================================
# DE-PARA de pontos - Gateway Multiprotocolo WEG
#
#   origem --[de-para 1]--> MODELO CANONICO --[de-para 2]--> destino
#
# Variaveis baseadas nas grandezas monitoradas pelo TFM (Transformer Fleet
# Management) para transformadores a oleo e a seco.
#
# Alterar este arquivo NAO exige recompilar nada: e o requisito de
# parametrizacao do desafio (mudar endereco de origem/destino, protocolos,
# tipo, escala, offset e unidade de engenharia).
#
# A escala da ORIGEM (scale/offset) normaliza o dado bruto para a grandeza
# fisica. A escala do DESTINO (target_scale/target_offset) codifica a grandeza
# fisica na convencao do sistema consumidor. Sao independentes.
# ============================================================================

mapping_version: '1.2'

points:

# ============================================================================
# FLUXO 1 - Modbus -> OPC UA        (POBRE -> RICO)
# Demonstra ENRIQUECIMENTO: o gateway precisa sintetizar tipo, unidade,
# escala, qualidade e timestamp, porque nada disso existe no fio Modbus.
# ============================================================================
  - point_id: TR01_OIL_TEMP_MODBUS
    source_protocol: modbus
    source_device: IED-MODBUS-01
    source_address: '40001'        # holding register cru, 16 bits
    asset_id: TR-01
    asset_type: power_transformer
    measurement: oil_top_temperature
    iec61850_hint: YPTR1.TmpOil    # ponte semantica para o modelo 61850
    data_type: float
    unit: Cel                      # unidade nao existe no Modbus: vem daqui
    scale: 0.1                     # registrador 253 -> 25.3 Cel
    offset: 0.0
    min_value: -50.0               # validacao de entrada
    max_value: 200.0
    target_protocol: opcua
    target_address: TR-01.OilTopTemperature

  - point_id: TR01_CURRENT_L1_MODBUS
    source_protocol: modbus
    source_device: IED-MODBUS-01
    source_address: '40002'
    asset_id: TR-01
    asset_type: power_transformer
    measurement: secondary_current_l1
    iec61850_hint: MMXU1.A.phsA
    data_type: float
    unit: A
    scale: 0.5
    offset: 0.0
    min_value: 0.0
    max_value: 5000.0
    target_protocol: opcua
    target_address: TR-01.SecondaryCurrentL1

# ============================================================================
# FLUXO 2 - IEC 61850 MMS -> Modbus       (RICO -> POBRE)
# Demonstra PERDA: qualidade, timestamp, unidade e modelo semantico existem
# na origem e NAO tem onde ser representados no destino.
# ============================================================================
  - point_id: TR02_OIL_TEMP_MMS
    source_protocol: iec61850-mms
    source_device: IED-61850-01
    source_address: simpleIOGenericIO/GGIO1.AnIn1.mag.f@MX
    asset_id: TR-02
    asset_type: power_transformer
    measurement: oil_top_temperature
    iec61850_hint: YPTR1.TmpOil
    data_type: float
    unit: Cel
  # o IED simulado entrega uma senoide -1..1; escala e offset mapeiam
  # para a faixa realista de temperatura de oleo de um transformador
    scale: 20.0
    offset: 65.0
    min_value: -50.0
    max_value: 200.0
    target_protocol: modbus
    target_address: '40010'
  # escala do DESTINO: 84.9 Cel -> registrador 849 (convencao do SCADA cliente)
    target_scale: 0.1
    target_offset: 0.0

# ============================================================================
# FLUXO 3 - IEC 61850 MMS -> OPC UA       (RICO -> RICO)
# Demonstra o caso de MENOR perda: tudo sobrevive.
# Precedente: Companion Specification "OPC UA for IEC 61850".
# ============================================================================
  - point_id: TR02_AMBIENT_TEMP_MMS
    source_protocol: iec61850-mms
    source_device: IED-61850-01
    source_address: simpleIOGenericIO/GGIO1.AnIn2.mag.f@MX
    asset_id: TR-02
    asset_type: power_transformer
    measurement: ambient_temperature
    iec61850_hint: MMXU1.EnvTmp
    data_type: float
    unit: Cel
    scale: 10.0
    offset: 25.0
    min_value: -50.0
    max_value: 100.0
    target_protocol: opcua
    target_address: TR-02.AmbientTemperature

# ============================================================================
# EXEMPLO PRATICO 2 (oficial) - DNP3 -> OPC UA
# Fonte DNP3 simulada (OpenDNP3 esta arquivada - ver adapters/dnp3_source.py).
# Ativo: banco de baterias (citado na lista de variaveis do TFM).
# ============================================================================
  - point_id: BAT01_VOLTAGE_DNP3
    source_protocol: dnp3
    source_device: OUTSTATION-BAT-01
    source_address: OUTSTATION-BAT-01/32.7.1   # Group 32 Var 7 = Analog Input Event c/ tempo
    asset_id: BAT-01
    asset_type: battery_bank
    measurement: dc_voltage
    data_type: float
    unit: V
    scale: 0.01                       # DNP3 manda inteiro x100 -> volts
    offset: 0.0
    min_value: 40.0
    max_value: 56.0
    target_protocol: opcua
    target_address: BAT-01.DcVoltage

# ============================================================================
# FLUXO 4 - OPC UA -> Modbus       (RICO -> POBRE, origem OPC UA)
# Completa os 4 protocolos como ORIGEM rodando simultaneamente.
# ============================================================================
  - point_id: SENSOR_AMBIENT_OPCUA
    source_protocol: opcua
    source_device: OPCUA-SENSOR-01
    source_address: "ns=2;s=AmbientTemperature"
    asset_id: TR-01
    asset_type: power_transformer
    measurement: ambient_temperature_opcua_native
    data_type: float
    unit: Cel
    scale: 1.0
    offset: 0.0
    min_value: -40.0
    max_value: 90.0
    target_protocol: modbus
    target_address: "40021"
    target_scale: 0.1
    target_offset: 0.0

# ============================================================================
# PONTOS PARA DEMONSTRAR QUARENTENA (valor fora da faixa configurada)
# ============================================================================
  - point_id: TR02_OIL_TEMP_MMS_FAIXA_ESTREITA
    source_protocol: iec61850-mms
    source_device: IED-61850-01
    source_address: simpleIOGenericIO/GGIO1.AnIn1.mag.f@MX
    asset_id: TR-02
    asset_type: power_transformer
    measurement: oil_top_temperature_estreito
    iec61850_hint: YPTR1.TmpOil
    data_type: float
    unit: Cel
    scale: 20.0
    offset: 65.0
    # faixa deliberadamente estreita (a leitura real oscila 45..85) para
    # forcar quarentena de forma deterministica - simula sensor com defeito
    min_value: 90.0
    max_value: 95.0
    target_protocol: opcua
    target_address: TR-02.OilTopTemperatureEstreito
  - point_id: TR01_OIL_TEMP_FORA_FAIXA
    source_protocol: modbus
    source_device: IED-MODBUS-01
    source_address: '40003'
    asset_id: TR-01
    asset_type: power_transformer
    measurement: oil_top_temperature_sensor_b
    iec61850_hint: YPTR1.TmpOil
    data_type: float
    unit: Cel
    scale: 1.0                      # sem escala: 9999 no registrador -> 9999 Cel
    offset: 0.0
    min_value: -50.0
    max_value: 200.0                # 9999 estoura -> vai para quarentena
    target_protocol: opcua
    target_address: TR-01.OilTopTemperatureSensorB
  - point_id: TR03_WINDING_TEMP
    source_protocol: modbus
    source_device: IED-MODBUS-02
    source_address: '40020'
    asset_id: TR-03
    asset_type: power_transformer
    measurement: winding_temperature
    data_type: float
    unit: Cel
    scale: 0.1
    offset: 0.0
    target_protocol: opcua
    target_address: TR-03.WindingTemperature
    target_scale: 1.0
    target_offset: 0.0
    iec61850_hint: YPTR1.TmpWnd
    min_value: -50.0
    max_value: 250.0
